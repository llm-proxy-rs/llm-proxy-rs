[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
anthropic-request = { path = "../anthropic-request" }
anthropic-response = { path = "../anthropic-response" }
aws-config = "1.9.0"
aws-credential-types = "1.3.0"
aws-sdk-bedrockruntime = "1.136.0"
axum = "0.8.9"
chat = { path = "../chat" }
common = { path = "../common" }
config = "0.15.25"
reqwest = { version = "0.13.4", features = ["stream"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
aws-sdk-bedrockruntime = { version = "1.136.0", features = ["test-util"] }
aws-smithy-mocks = "0.3.0"
aws-smithy-runtime-api = "1.13.0"
aws-smithy-types = "1.6.1"
base64 = "0.22.1"
http-body-util = "0.1.4"
tower = "0.5.3"
